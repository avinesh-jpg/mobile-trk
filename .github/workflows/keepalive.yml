name: Render Backend Workday Keep-Alive

on:
  schedule:
    # Runs every 10 minutes between 02:00 UTC (7:30 AM IST) and 15:30 UTC (9:00 PM IST)
    # This prevents Render free-tier from sleeping during the working day.
    - cron: '*/10 2-15 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging GeoTrack Render Backend to maintain warm state..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "https://geotrack-backend-e812.onrender.com/" || echo "failed")
          echo "Render Backend response HTTP status: $STATUS"
