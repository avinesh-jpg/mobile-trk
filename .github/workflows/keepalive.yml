name: Render Workday Keep-Alive (Continuous 3-Min Loop, 8 AM - 8 PM IST)

on:
  schedule:
    # Runs every 15 minutes on offset minutes (04, 19, 34, 49) from 02:00 to 14:49 UTC (7:34 AM to 8:19 PM IST).
    # Using offset minutes avoids GitHub's top-of-the-hour (:00) queue congestion.
    - cron: '4,19,34,49 2-14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  keepalive-loop:
    name: Continuous Workday Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Display Session Details
        run: |
          echo "=========================================================="
          echo "  GeoTrack Enterprise Workday Keep-Alive Daemon           "
          echo "  IST Time       : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M:%S %p %Z')"
          echo "  Active Window  : 07:30 AM to 08:20 PM IST               "
          echo "  Strategy       : Continuous 3-minute pulse loop          "
          echo "=========================================================="

      - name: Execute 3-Minute Heartbeat Loop (Active Runner)
        run: |
          BACKEND_URL="https://geotrack-backend-e812.onrender.com/"
          DASHBOARD_URL="https://geotrack-dashboard.onrender.com/"

          # Run 4 pulses spaced 3 minutes (180 seconds) apart.
          # Total active run time: ~12 minutes, keeping Render alive continuously
          # until the next offset scheduled workflow takes over.
          for i in 1 2 3 4
          do
            echo "----------------------------------------------------------"
            echo "Pulse $i of 4 | Current IST: $(TZ='Asia/Kolkata' date '+%I:%M:%S %p')"
            echo "----------------------------------------------------------"

            # 1. Ping Backend API
            START_TIME=$(date +%s%N)
            B_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 35 --max-time 60 --retry 2 --retry-delay 3 "$BACKEND_URL" || echo "TIMEOUT")
            END_TIME=$(date +%s%N)
            DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))

            if [ "$B_STATUS" = "200" ]; then
              echo "✅ Backend responded HTTP 200 in ${DURATION_MS}ms"
            else
              echo "⚠️ Backend responded: $B_STATUS (${DURATION_MS}ms). Waking up..."
              # Immediate follow-up warm-up request
              curl -s -o /dev/null "$BACKEND_URL" || true
            fi

            # 2. Ping Web Dashboard
            D_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 45 "$DASHBOARD_URL" || echo "TIMEOUT")
            if [ "$D_STATUS" = "200" ]; then
              echo "✅ Dashboard responded HTTP 200"
            else
              echo "⚠️ Dashboard responded: $D_STATUS"
            fi

            # Wait 180 seconds before next pulse (except after the final pulse)
            if [ $i -lt 4 ]; then
              echo "Sleeping for 180 seconds (3 minutes) to maintain warm state..."
              sleep 180
            fi
          done

          echo "=========================================================="
          echo "Completed 12-minute keep-alive session. Next runner will take over."
          echo "=========================================================="
