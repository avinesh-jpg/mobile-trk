name: Render Workday Keep-Alive (8 AM - 8 PM IST)

on:
  schedule:
    # Runs every 10 minutes from 02:00 UTC to 14:50 UTC (7:30 AM to 8:20 PM IST)
    # Prevents Render free-tier spin-down during active work hours.
    # Stops automatically at night so servers sleep after 8:20 PM IST.
    - cron: '*/10 2-14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  keepalive:
    name: Ping GeoTrack Backend & Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Display Timestamp & Active Shift Window
        run: |
          echo "=========================================="
          echo "GeoTrack Workday Keep-Alive Pinger"
          echo "IST Time: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M:%S %p %Z')"
          echo "Active Window: 08:00 AM to 08:00 PM IST"
          echo "=========================================="

      - name: Ping Render Backend
        run: |
          BACKEND_URL="https://geotrack-backend-e812.onrender.com/"
          echo "Pinging Backend: $BACKEND_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 --retry 2 --retry-delay 5 "$BACKEND_URL" || echo "FAILED")
          echo "Backend HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is warm and responding instantly."
          else
            echo "⚠️ Backend responded with status: $STATUS"
          fi

      - name: Ping Render Web Dashboard
        run: |
          DASHBOARD_URL="https://geotrack-dashboard.onrender.com/"
          echo "Pinging Dashboard: $DASHBOARD_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 --retry 2 --retry-delay 5 "$DASHBOARD_URL" || echo "FAILED")
          echo "Dashboard HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Dashboard is warm and ready."
          else
            echo "⚠️ Dashboard responded with status: $STATUS"
          fi
