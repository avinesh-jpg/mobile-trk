services:
  # 1. Python FastAPI Backend Web Service (Free / Starter Tier)
  - type: web
    name: geotrack-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      # Automatic primary routing: can point to private cloud OSRM or public cluster
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org

  # 2. React Web Dashboard (Static Site - Free Tier)
  - type: web
    name: geotrack-dashboard
    runtime: static
    rootDir: web-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_WS_BASE
        sync: false

  # 3. Optional Private Cloud OSRM Container (Standard Tier with 2GB RAM)
  # Uncomment below if deploying private in-house routing cluster on Render:
  # - type: web
  #   name: geotrack-osrm
  #   runtime: docker
  #   dockerfilePath: backend/osrm/Dockerfile
  #   plan: standard
  #   healthCheckPath: /route/v1/driving/77.3396,11.1072;77.3060,11.1542
  #   envVars:
  #     - key: PORT
  #       value: 5000
